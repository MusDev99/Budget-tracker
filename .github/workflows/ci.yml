# Gate for every PR: JS syntax check, unit tests, and the committed Tailwind build is up to date.
# Add "verify" as a required status check next to "branch-policy" (see BRANCHING.md).
name: ci

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify (syntax + tests + Tailwind build is committed)
        run: npm run verify
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
